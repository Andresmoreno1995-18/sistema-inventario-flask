<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar Sesión - Inventario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1d4ed8,
                    #0f172a
                );
        }

        .login-card {

            width: 100%;
            max-width: 420px;

            border: none;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }

    </style>

</head>


<body>


    <div class="card login-card">

        <div class="card-body p-4">


            <div class="text-center mb-4">

                <div style="font-size: 60px;">
                    📦
                </div>

                <h3 class="fw-bold">
                    Sistema de Inventario
                </h3>

                <p class="text-muted">
                    Iniciar sesión
                </p>

            </div>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div
                            class="alert alert-{{ category }}"
                            role="alert"
                        >
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                method="POST"
                action="/login"
            >


                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="usuario"
                        class="form-control"
                        placeholder="Ingrese su usuario"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100 py-2 fw-bold"
                >
                    Iniciar Sesión
                </button>


            </form>


            <div class="text-center mt-4">

                <p class="text-muted mb-2">
                    ¿No tiene una cuenta?
                </p>

                <a
                    href="/registro"
                    class="btn btn-outline-primary w-100"
                >
                    Crear nuevo usuario
                </a>

            </div>


        </div>

    </div>


</body>

</html>
