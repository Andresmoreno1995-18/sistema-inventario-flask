<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iniciar Sesión - Sistema de Inventario
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h3 class="card-title text-center mb-4">
                            Iniciar Sesión
                        </h3>

                        {% with messages = get_flashed_messages(with_categories=true) %}

                            {% if messages %}

                                {% for category, message in messages %}

                                    <div
                                        class="alert alert-{{ category }}"
                                        role="alert"
                                    >
                                        {{ message }}
                                    </div>

                                {% endfor %}

                            {% endif %}

                        {% endwith %}


                        <form
                            action="{{ url_for('login') }}"
                            method="POST"
                        >

                            <div class="mb-3">

                                <label
                                    for="usuario"
                                    class="form-label"
                                >
                                    Usuario
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="usuario"
                                    name="usuario"
                                    placeholder="Ej: admin"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="••••••••"
                                    required
                                >

                            </div>


                            <div class="d-grid gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Ingresar al Sistema
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
