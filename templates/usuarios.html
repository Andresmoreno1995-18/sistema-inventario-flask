<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Usuarios</h2>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver al Inicio</a>
        </div>

        <!-- Alertas de Flask -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btnPara solucionar este problema de forma definitiva y que la tabla de usuarios se vea correctamente en tu aplicación, el archivo **`usuarios.html`** dentro de tu carpeta `templates` debe contener una estructura HTML limpia con el bucle de Jinja2 para recorrer la lista de usuarios que le envías desde `app.py`.

Copia y pega este código limpio en tu archivo **`usuarios.html`**:

```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Usuarios</h2>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver al Inicio</a>
        </div>

        <!-- Tarjetas de Resumen -->
        <div class="row text-center mb-4">
            <div class="col-md-2"><div class="card p-3 shadow-sm"><h5>Total</h5><p class="fs-4">{{ total_usuarios }}</p></div></div>
            <div class="col-md-2"><div class="card p-3 shadow-sm"><h5>Admins</h5><p class="fs-4">{{ total_admins }}</p></div></div>
            <div class="col-md-2"><div class="card p-3 shadow-sm"><h5>Normales</h5><p class="fs-4">{{ total_normales }}</p></div></div>
            <div class="col-md-2"><div class="card p-3 shadow-sm"><h5>Hombres</h5><p class="fs-4">{{ total_hombres }}</p></div></div>
            <div class="col-md-2"><div class="card p-3 shadow-sm"><h5>Mujeres</h5><p class="fs-4">{{ total_mujeres }}</p></div></div>
        </div>

        <!-- Tabla de Usuarios -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Género</th>
                            <th>Fecha de Registro</th>
                            <th>Creado Por</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in usuarios %}
                        <tr>
                            <td>{{ u.id }}</td>
                            <td>{{ u.usuario }}</td>
                            <td>{{ u.rol }}</td>
                            <td>{{ u.genero }}</td>
                            <td>{{ u.fecha_registro }}</td>
                            <td>{{ u.creado_por }}</td>
                            <td>
                                <a href="{{ url_for('editar_usuario', id=u.id) }}" class="btn btn-sm btn-warning">Editar</a>
                                <a href="{{ url_for('eliminar_usuario', id=u.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro de eliminar este usuario?');">Eliminar</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
