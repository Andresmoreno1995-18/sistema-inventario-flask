<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrar usuario</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.20);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            color: #222;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .volver {
            display: block;
            margin-top: 18px;
            text-align: center;
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }

        .mensaje {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
            background: #f8d7da;
            color: #842029;
        }

        @media (max-width: 500px) {

            .tarjeta {
                padding: 22px;
            }

        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <h1>Crear usuario</h1>

            <p class="subtitulo">
                Registro de usuarios del sistema
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="mensaje">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                method="POST"
                action="{{ url_for('registro') }}"
            >

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingrese el usuario"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese la contraseña"
                    required
                >


                <label for="genero">
                    Género
                </label>

                <select
                    id="genero"
                    name="genero"
                    required
                >

                    <option value="">
                        Seleccione una opción
                    </option>

                    <option value="Hombre">
                        Hombre
                    </option>

                    <option value="Mujer">
                        Mujer
                    </option>

                </select>


                <label for="rol">
                    Rol del usuario
                </label>

                <select
                    id="rol"
                    name="rol"
                    required
                >

                    <option value="">
                        Seleccione un rol
                    </option>

                    <option value="usuario">
                        Usuario
                    </option>

                    <option value="admin">
                        Administrador
                    </option>

                </select>


                <button type="submit">
                    Crear usuario
                </button>

            </form>


            <a
                class="volver"
                href="{{ url_for('index') }}"
            >
                ← Volver al sistema
            </a>

        </div>

    </div>

</body>

</html>
