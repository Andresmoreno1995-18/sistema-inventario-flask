<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrar Usuario - Inventario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1d4ed8,
                    #0f172a
                );
        }

        .registro-card {

            width: 100%;
            max-width: 430px;

            border: none;
            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }

        .genero-option {

            border: 2px solid #dee2e6;
            border-radius: 14px;

            padding: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        .genero-option:hover {

            border-color: #0d6efd;
            background-color: #f8f9fa;
        }

        .icono-genero {

            font-size: 38px;
            display: block;
            margin-bottom: 5px;
        }

    </style>

</head>


<body>

    <div class="card registro-card">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <div style="font-size: 55px;">
                    👤
                </div>

                <h3 class="fw-bold">
                    Crear Usuario
                </h3>

                <p class="text-muted mb-0">
                    Sistema de Gestión de Inventario
                </p>

            </div>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div
                            class="alert alert-{{ category }}"
                            role="alert"
                        >
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                method="POST"
                action="/registro"
            >


                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="usuario"
                        class="form-control"
                        placeholder="Ejemplo: andres"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Ingrese una contraseña"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label fw-bold d-block">
                        Seleccione su género
                    </label>


                    <div class="row g-2">


                        <div class="col-6">

                            <label
                                class="genero-option w-100 text-center"
                            >

                                <span class="icono-genero">
                                    👨
                                </span>

                                <input
                                    type="radio"
                                    name="genero"
                                    value="Hombre"
                                    required
                                >

                                Hombre

                            </label>

                        </div>


                        <div class="col-6">

                            <label
                                class="genero-option w-100 text-center"
                            >

                                <span class="icono-genero">
                                    👩
                                </span>

                                <input
                                    type="radio"
                                    name="genero"
                                    value="Mujer"
                                    required
                                >

                                Mujer

                            </label>

                        </div>


                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100 py-2 fw-bold"
                >
                    Registrar Usuario
                </button>


            </form>


            <div class="text-center mt-3">

                <a
                    href="/login"
                    class="text-decoration-none"
                >
                    Volver al inicio de sesión
                </a>

            </div>


        </div>

    </div>

</body>

</html>
