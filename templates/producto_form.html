<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if producto %}
            Editar Producto
        {% else %}
            Agregar Producto
        {% endif %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <div
        class="container mt-5"
        style="max-width: 600px;"
    >

        <div class="card shadow-sm">


            <!-- ENCABEZADO -->

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    {% if producto %}
                        Editar Producto
                    {% else %}
                        Nuevo Producto
                    {% endif %}

                </h5>

            </div>


            <!-- FORMULARIO -->

            <div class="card-body">

                <form method="POST">


                    <!-- NOMBRE -->

                    <div class="mb-3">

                        <label
                            for="nombre"
                            class="form-label"
                        >
                            Nombre del Producto
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            value="{{ producto['nombre'] if producto else '' }}"
                            placeholder="Ej: Laptop Lenovo"
                            required
                        >

                    </div>


                    <!-- CATEGORÍA -->

                    <div class="mb-3">

                        <label
                            for="categoria"
                            class="form-label"
                        >
                            Categoría
                        </label>

                        <input
                            type="text"
                            id="categoria"
                            name="categoria"
                            class="form-control"
                            value="{{ producto['categoria'] if producto else '' }}"
                            placeholder="Ej: Tecnología"
                            required
                        >

                    </div>


                    <!-- PRECIO -->

                    <div class="mb-3">

                        <label
                            for="precio"
                            class="form-label"
                        >
                            Precio ($)
                        </label>

                        <input
                            type="number"
                            id="precio"
                            name="precio"
                            class="form-control"
                            value="{{ producto['precio'] if producto else 0 }}"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- EXISTENCIAS -->

                    <div class="mb-3">

                        <label
                            for="existencias"
                            class="form-label"
                        >
                            Existencias
                        </label>

                        <input
                            type="number"
                            id="existencias"
                            name="existencias"
                            class="form-control"
                            value="{{ producto['existencias'] if producto else 0 }}"
                            min="0"
                            required
                        >

                    </div>


                    <!-- BOTONES -->

                    <div class="d-flex justify-content-between">

                        <a
                            href="{{ url_for('index') }}"
                            class="btn btn-secondary"
                        >
                            Cancelar
                        </a>


                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            {% if producto %}
                                Actualizar Producto
                            {% else %}
                                Guardar Producto
                            {% endif %}
                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>


</body>

</html>
