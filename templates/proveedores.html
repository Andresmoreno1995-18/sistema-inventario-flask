<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Proveedores</h2>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver al Inicio</a>
        </div>

        <!-- Formulario para Agregar Proveedor -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4 class="mb-3">Agregar Nuevo Proveedor</h4>
                <form method="POST">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Contacto</label>
                            <input type="text" name="contacto" class="form-control">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" name="direccion" class="form-control">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Celular</label>
                            <input type="text" name="numero_celular" class="form-control">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Proveedor</button>
                </form>
            </div>
        </div>

        <!-- Tabla Estilizada de Proveedores -->
        <div class="table-box shadow-sm rounded bg-white p-3">
            <table class="resizable-table table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Contacto</th>
                        <th>Dirección</th>
                        <th>Celular</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in proveedores %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td>{{ p.nombre }}</td>
                        <td>{{ p.contacto }}</td>
                        <td>{{ p.direccion }}</td>
                        <td>{{ p.numero_celular }}</td>
                        <td>
                            <a href="{{ url_for('editar_proveedor', id=p.id) }}" class="btn btn-sm btn-warning">Editar</a>
                            <a href="{{ url_for('eliminar_proveedor', id=p.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro de eliminar este proveedor?');">Eliminar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
